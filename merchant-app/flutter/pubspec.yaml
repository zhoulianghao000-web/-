name: pawday_merchant
description: Pawday merchant identity, scoped operations and business analytics.
publish_to: none
version: 2.0.3+1
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/reference/
  fonts:
    - family: PawdaySans
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf

spring:
  application:
    name: pawday-backend
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pawday}
    username: ${SPRING_DATASOURCE_USERNAME:pawday}
    password: ${SPRING_DATASOURCE_PASSWORD:pawday_dev_only}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3s
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 16
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pawday}
    password: ${RABBITMQ_PASSWORD:pawday_dev_only}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080

pawday:
  ai:
    deepseek-api-key: ${PAWDAY_DEEPSEEK_API_KEY:}
    deepseek-model: ${PAWDAY_DEEPSEEK_MODEL:deepseek-flash}
    deepseek-url: ${PAWDAY_DEEPSEEK_URL:https://api.deepseek.com/chat/completions}
    allow-loopback-provider: ${PAWDAY_AI_ALLOW_LOOPBACK:false}
    timeout-seconds: ${PAWDAY_AI_TIMEOUT_SECONDS:8}
    worker-enabled: ${PAWDAY_AI_WORKER_ENABLED:true}
  storage:
    local-root: ${PAWDAY_STORAGE_LOCAL_ROOT:.local-media}
    max-bytes: 5242880
    grant-seconds: 300
    lease-seconds: 60
    cleanup-delay-ms: 30000
  search:
    enabled: ${PAWDAY_SEARCH_ENABLED:true}
    consumers-enabled: ${PAWDAY_SEARCH_CONSUMERS_ENABLED:true}
    workers-enabled: ${PAWDAY_SEARCH_WORKERS_ENABLED:true}
    url: ${OPENSEARCH_URL:http://localhost:9200}
    retry-max-attempts: 5
    retry-base-ms: 1000
    lease-ms: 30000
  outbox:
    workers-enabled: ${PAWDAY_OUTBOX_WORKERS_ENABLED:true}
    consumer-enabled: ${PAWDAY_OUTBOX_CONSUMER_ENABLED:true}
    max-attempts: 5
    retry-base-ms: 1000
    retry-max-ms: 60000
    lease-ms: 30000
    confirm-timeout-ms: 3000
    poll-ms: 500
  demo:
    enabled: ${PAWDAY_DEMO_ENABLED:false}
  auth:
    secret-key: ${PAWDAY_AUTH_SECRET}
    access-seconds: 900
    refresh-seconds: 2592000
    reverify-seconds: 300
    local-sms-enabled: ${PAWDAY_LOCAL_SMS_ENABLED:false}
    local-sms-directory: .local-sms

---
spring:
  config:
    activate:
      on-profile: "local & !production"
pawday:
  payment:
    simulation-enabled: true

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: pawday_it
      POSTGRES_USER: pawday_it
      POSTGRES_PASSWORD: TEST_ONLY_m23_db
    ports:
    - 127.0.0.1:5545:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U pawday_it -d pawday_it
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8.2.10-alpine
    ports:
    - 127.0.0.1:6385:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: pawday_it
      RABBITMQ_DEFAULT_PASS: TEST_ONLY_m22_broker
    ports:
    - 127.0.0.1:5675:5672
    - 127.0.0.1:15675:15672
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - check_running
      interval: 5s
      timeout: 5s
      retries: 30
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      network.host: 0.0.0.0
      cluster.name: pawday-m23-it
    ports:
    - 127.0.0.1:9205:9200
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s'
        >/dev/null
      interval: 5s
      timeout: 5s
      retries: 60
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

# Isolated synthetic engineering fixtures, never a production template.
services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: pawday_ops_test
      POSTGRES_USER: pawday_ops_test
      POSTGRES_PASSWORD: TEST_ONLY_m62_db
    labels:
      cn.pawday.operations.fixture: 'true'
    ports: ['127.0.0.1:5546:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pawday_ops_test -d pawday_ops_test']
      interval: 3s
      timeout: 3s
      retries: 40
  prometheus:
    image: prom/prometheus:v3.5.5
    ports: ['127.0.0.1:9190:9090']
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ./deployment/operations/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployment/operations/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deployment/operations/rules-test.yml:/etc/prometheus/rules-test.yml:ro
      - ./.local-operations/scrape-token:/run/secrets/scrape-token:ro
    depends_on: [alertmanager]
  alertmanager:
    image: prom/alertmanager:v0.34.1
    ports: ['127.0.0.1:9193:9093']
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ./deployment/operations/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./.local-operations/webhook-token:/run/secrets/webhook-token:ro

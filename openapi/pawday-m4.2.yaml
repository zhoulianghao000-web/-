openapi: 3.1.0
info:
  title: Pawday M4.2 Orders and Inventory Reservations API
  version: 0.4.2
  description: Implemented atomic Quote consumption, merchant suborders, immutable order snapshots, stock/coupon
    reservations, unpaid whole-order cancellation and expiration. Payment intent is pending; payment attempts
    and fulfillment follow in later stages.
  license:
    name: Private project
servers:
  - url: /api/v1
tags:
  - name: consumer
    description: consumer identity boundary
  - name: merchant
    description: merchant identity boundary
  - name: admin
    description: admin identity boundary
  - name: public
    description: Anonymous taxonomy reads
paths:
  /consumer/auth/phone/request-code:
    post:
      operationId: post_consumer_auth_phone_request_code
      summary: POST /consumer/auth/phone/request-code
      description: LOGIN 可匿名，REVERIFY 绑定消费者会话及本人手机。200 表示 OTP 挑战、加密发送材料与 Outbox 同一事务提交，短信异步投递；MQ
        停机不影响该提交。不返回验证码。过期/被替代挑战跳过发送。
      tags:
        - consumer
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptEnvelope"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid or missing credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Realm, permission or reverify denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Resource unavailable in actor scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Version or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-implemented-in: M2.1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"

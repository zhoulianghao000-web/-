        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        description: 绑定当前 session/action、300 秒有效、成功写入时单次消费；事务失败回滚消费。
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: 同主体及命令内唯一；同键不同载荷返回 409。
  /admin/operations/search/reconcile:
    post:
      operationId: search_reconcile
      summary: search_reconcile
      description: Reads real OpenSearch outside business transaction, compares PostgreSQL
        source documents. Drift schedules a validated fresh-index rebuild; does not
        bypass external versions or delete live index. Requires session/action=search.reconcile
        reverify, search.manage and Idempotency-Key. Same key+payload returns prior
        receipt.
      tags:
      - search
      security:
      - adminBearer: []
      x-implemented-in: M2.3
      responses:
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid or missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Realm, permission or reverify denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource unavailable in actor scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Version or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Upload maximum exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Unsupported action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchCommandReceiptEnvelope'
      x-permission: search.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCommandRequest'
      parameters: *id006
  /admin/operations/search/retry:
    post:
      operationId: search_retry
      summary: search_retry
      description: Resets eligible DEAD synchronization tasks and latest failed rebuild.
        Never clears a PROCESSED inbox. Protected action-specific proof, current permissions,
        audit and idempotency. Requires session/action=search.retry reverify, search.manage
        and Idempotency-Key. Same key+payload returns prior receipt.
      tags:
      - search
      security:
      - adminBearer: []
      x-implemented-in: M2.3
      responses:
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid or missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Realm, permission or reverify denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Resource unavailable in actor scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Version or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Upload maximum exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Unsupported action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchCommandReceiptEnvelope'
      x-permission: search.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCommandRequest'
      parameters: *id006

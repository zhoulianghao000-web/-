      - meta
    Tokens:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        refresh_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        expires_in:
          type: integer
          minimum: 1
        session_id: *id001
        user_id: &id006
          type:
          - string
          - 'null'
          format: uuid
      required:
      - access_token
      - refresh_token
      - expires_in
      - session_id
      - user_id
    Receipt:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        version:
          type: integer
          minimum: 0
        accepted_at: &id005
          type: string
          format: date-time
      required:
      - id

# Synthetic engineering only. No live credentials, published ports or external network.
services:
  archive-init:
    image: pawday-postgres:17.11-security20261013
    build:
      context: .
      dockerfile: deployment/images/alpine-runtime.Dockerfile
      args:
        BASE_IMAGE: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    entrypoint: [sh, -c, 'mkdir -p /archive/wal && chown -R postgres:postgres /archive']
    volumes: [archive:/archive]
    networks: [recovery]
  postgres:
    image: pawday-postgres:17.11-security20261013
    build:
      context: .
      dockerfile: deployment/images/alpine-runtime.Dockerfile
      args:
        BASE_IMAGE: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: pawday_recovery_test
      POSTGRES_USER: pawday_recovery_test
      POSTGRES_PASSWORD: TEST_ONLY_M63
      POSTGRES_INITDB_ARGS: --wal-segsize=1 --data-checksums
    command: [postgres, -c, wal_level=replica, -c, archive_mode=on, -c, 'archive_command=sh /opt/pawday/archive-wal.sh %p %f', -c, archive_timeout=5s]
    labels: {cn.pawday.recovery.fixture: 'true'}
    depends_on:
      archive-init: {condition: service_completed_successfully}
    volumes:
      - archive:/archive
      - ./deployment/recovery/archive-wal.sh:/opt/pawday/archive-wal.sh:ro
    networks: [recovery]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, pawday_recovery_test, -d, pawday_recovery_test]
      interval: 3s
      timeout: 3s
      retries: 30
  opensearch:
    image: pawday-opensearch:3.9.0-security20261013
    build:
      context: .
      dockerfile: deployment/images/opensearch.Dockerfile
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      network.host: 0.0.0.0
      cluster.name: pawday-m63-recovery
    labels: {cn.pawday.recovery.fixture: 'true'}
    networks: [recovery]
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
    ulimits:
      nofile: {soft: 65536, hard: 65536}
volumes:
  archive:
networks:
  recovery:
    internal: true

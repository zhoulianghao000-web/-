name: ci
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  storage-search-and-real-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAWDAY_IT_RABBIT_HOST: 127.0.0.1
      PAWDAY_IT_RABBIT_PORT: "5675"
      PAWDAY_IT_RABBIT_USER: pawday_it
      PAWDAY_IT_RABBIT_PASSWORD: TEST_ONLY_m22_broker
      PAWDAY_IT_RABBIT_CONTAINER: pawday-m23-it-rabbitmq-1
      PAWDAY_IT_REDIS_HOST: 127.0.0.1
      PAWDAY_IT_REDIS_PORT: "6385"
      PAWDAY_IT_OPENSEARCH_URL: http://127.0.0.1:9205
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start all four real services with health checks
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker compose -p pawday-m23-it -f compose.integration.yaml up -d --wait --wait-timeout 300
      - name: Mandatory storage, search, Redis and RabbitMQ gate
        working-directory: backend
        run: mvn -B -ntp -Pinfrastructure-it verify
      - name: Validate contracts and actual HTTP responses
        run: |
          python -m pip install -r openapi/requirements-validation-lock.txt
          python openapi/validate_contract.py
          python openapi/validate_m23_contract.py --samples backend/target/contract-samples.json --report openapi/identity-response-report.json
          python openapi/validate_m23_contract.py --samples backend/target/m22-contract-samples.json --report openapi/delivery-response-report.json
          python openapi/validate_m23_contract.py --samples backend/target/m23-storage-contract-samples.json --report openapi/storage-response-report.json
          python openapi/validate_m23_contract.py --samples backend/target/m23-search-contract-samples.json --report openapi/search-response-report.json
          python openapi/validate_m31_contract.py --samples backend/target/m31-contract-samples.json --report openapi/pet-response-report.json
          python openapi/validate_m32_contract.py --samples backend/target/m32-contract-samples.json --report openapi/catalog-response-report.json
          python openapi/validate_m33_contract.py --samples backend/target/m33-contract-samples.json --report openapi/offer-response-report.json
          python openapi/validate_m34_contract.py --samples backend/target/m34-contract-samples.json --report openapi/consumer-catalog-response-report.json
          # BusinessSearchIT now also captures reverify for current publishing actions.
          # Validate these current runtime responses with the current contract, while
          # retaining standalone historical contract validation in the openapi job.
          python openapi/validate_m52_contract.py --samples backend/target/m34-search-contract-samples.json --report openapi/business-search-response-report.json
      - name: M4.1 checkout runtime and actual HTTP contract
        run: |
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m4.1.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m4.1.yaml -o /tmp/pawday-m41-bundled.yaml
          python openapi/validate_m41_contract.py --samples backend/target/m41-contract-samples.json --report openapi/checkout-response-report.json
      - name: M4.2 orders runtime and actual HTTP contract
        run: |
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m4.2.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m4.2.yaml -o /tmp/pawday-m42-bundled.yaml
          python openapi/validate_m42_contract.py --samples backend/target/m42-contract-samples.json --report openapi/order-response-report.json
      - name: M4.3 payment runtime and actual HTTP contract
        run: |
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m4.3.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m4.3.yaml -o /tmp/pawday-m43-bundled.yaml
          python openapi/validate_m43_contract.py --samples backend/target/m43-contract-samples.json --report openapi/payment-response-report.json
      - name: M4.4 fulfillment runtime and actual HTTP contract
        run: |
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m4.4.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m4.4.yaml -o /tmp/pawday-m44-bundled.yaml
          python openapi/validate_m44_contract.py --samples backend/target/m44-contract-samples.json --report openapi/fulfillment-response-report.json
      - name: M4.5 after-sale and refund runtime and actual HTTP contract
        run: |
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m4.5.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m4.5.yaml -o /tmp/pawday-m45-bundled.yaml
          python openapi/validate_m45_contract.py --samples backend/target/m45-contract-samples.json --report openapi/aftersale-refund-response-report.json
      - name: M4.6 settlement ledger runtime and actual HTTP contract
        run: |
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m4.6.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m4.6.yaml -o /tmp/pawday-m46-bundled.yaml
          python openapi/validate_m46_contract.py --samples backend/target/m46-contract-samples.json --report openapi/settlement-response-report.json
      - name: M5.1 membership and points runtime and actual HTTP contract
        run: |
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m5.1.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m5.1.yaml -o /tmp/pawday-m51-bundled.yaml
          python openapi/validate_m51_contract.py --samples backend/target/m51-contract-samples.json --report openapi/membership-points-response-report.json
      - name: M5.2 reviews and content real HTTP and binary contracts
        run: |
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m5.2.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m5.2.yaml -o /tmp/pawday-m52-bundled.yaml
          python openapi/validate_m52_contract.py --samples backend/target/m52-contract-samples.json --binary-samples backend/target/m52-binary-samples.json --report openapi/reviews-content-response-report.json
      - name: M5.3 private support and actual RabbitMQ delivery contracts
        run: |
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m5.3.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m5.3.yaml -o /tmp/pawday-m53-bundled.yaml
          python openapi/validate_m53_contract.py --samples backend/target/m53-contract-samples.json --binary-samples backend/target/m53-binary-samples.json --report openapi/support-messages-response-report.json
          python openapi/validate_m53_contract.py --samples backend/target/m53-delivery-contract-samples.json --report openapi/support-delivery-response-report.json
      - name: M5.4 nearby real HTTP and broker recovery contracts
        run: |
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m5.4.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m5.4.yaml -o /tmp/pawday-m54-bundled.yaml
          python openapi/validate_m54_contract.py --samples backend/target/m54-contract-samples.json --require-new-coverage --report openapi/nearby-response-report.json
          python openapi/validate_m54_contract.py --samples backend/target/m54-delivery-contract-samples.json --report openapi/nearby-delivery-response-report.json
      - name: M5.5 real PostgreSQL and HTTP provider fault contract gate
        run: |
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m5.5.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m5.5.yaml -o /tmp/pawday-m55-bundled.yaml
          python openapi/validate_m55_contract.py --samples backend/target/m55-contract-samples.json --require-new-coverage --report openapi/ai-response-report.json
      - name: M5.4 real AMap HTTPS destination handoff
        run: python scripts/check-amap-handoff.py --samples backend/target/m54-contract-samples.json --report backend/target/infrastructure-evidence/amap-handoff.json
      - name: M6.1 production inventory and mandatory rejection gates
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/check-production-admission.py --report backend/target/readiness-evidence/inventory-lint.json
          set +e
          python scripts/check-production-admission.py --release --commit "$GITHUB_SHA" --report backend/target/readiness-evidence/release-blocked.json
          gate_status=$?
          set -e
          test "$gate_status" -eq 2
          python scripts/check-production-startup.py --jar backend/target/pawday-backend-0.6.2-SNAPSHOT.jar --report backend/target/readiness-evidence/production-startup.json
      - name: Real infrastructure diagnostics
        if: always()
        run: |
          mkdir -p backend/target/infrastructure-evidence
          docker compose -p pawday-m23-it -f compose.integration.yaml logs --no-color > backend/target/infrastructure-evidence/services.log 2>&1 || true
          docker compose -p pawday-m23-it -f compose.integration.yaml ps --format json > backend/target/infrastructure-evidence/containers.json || true
          curl --fail --silent http://127.0.0.1:9205/_cluster/health > backend/target/infrastructure-evidence/opensearch-health.json || true
          docker exec pawday-m23-it-redis-1 redis-cli INFO server > backend/target/infrastructure-evidence/redis-server.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m23-test-evidence
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/*contract-samples.json
            backend/target/*binary-samples.json
            backend/target/m23-infrastructure-evidence.json
            backend/target/infrastructure-evidence/
            backend/target/readiness-evidence/
            backend/target/pawday-backend-0.6.2-SNAPSHOT.jar
            openapi/*response-report.json
      - name: Stop only isolated integration services
        if: always()
        run: docker compose -p pawday-m23-it -f compose.integration.yaml down
  operations-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact application and create synthetic ciphertext fixtures
        run: mvn -B -ntp -f backend/pom.xml -Dtest=DataEncryptionKeyRingTests,OperationsIntegrationTests package
      - name: Create disposable credentials and isolated local monitoring stack
        run: |
          python scripts/init-operations-fixture.py --test-only
          docker compose -p pawday-m62-it -f compose.operations.yaml up -d --wait --wait-timeout 180
          docker compose -p pawday-m62-it -f compose.operations.yaml exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          docker compose -p pawday-m62-it -f compose.operations.yaml exec -T prometheus promtool test rules /etc/prometheus/rules-test.yml
          docker compose -p pawday-m62-it -f compose.operations.yaml exec -T alertmanager amtool check-config /etc/alertmanager/alertmanager.yml
      - name: Mandatory real notification, outage and isolated restore gate
        run: python scripts/operations-engineering-gate.py --test-only --commit '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m62-operations-evidence
          path: |
            backend/target/operations-evidence/
            backend/target/surefire-reports/
      - name: Stop only this engineering stack
        if: always()
        run: docker compose -p pawday-m62-it -f compose.operations.yaml down
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and bundle contracts
        run: |
          python -m pip install -r openapi/requirements-validation-lock.txt
          python openapi/validate_contract.py
          python openapi/validate_m23_contract.py
          python openapi/validate_m31_contract.py
          python openapi/validate_m32_contract.py
          python openapi/validate_m33_contract.py
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-v1.yaml openapi/pawday-m2.1.yaml openapi/pawday-m2.2.yaml openapi/pawday-m2.3.yaml
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m3.1.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m3.1.yaml --output openapi/pawday-m3.1.redocly.bundle.json
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m3.2.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m3.2.yaml --output openapi/pawday-m3.2.redocly.bundle.json

          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m3.3.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m3.3.yaml --output openapi/pawday-m3.3.redocly.bundle.json
          python openapi/validate_m34_contract.py
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m3.4.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m3.4.yaml --output openapi/pawday-m3.4.redocly.bundle.json
          python openapi/validate_m41_contract.py
          python openapi/validate_m42_contract.py
          python openapi/validate_m43_contract.py
          python openapi/validate_m44_contract.py
          python openapi/validate_m45_contract.py
          python openapi/validate_m46_contract.py
          python openapi/validate_m51_contract.py
          python openapi/validate_m52_contract.py
          python openapi/validate_m53_contract.py
          python openapi/validate_m54_contract.py
          python openapi/validate_m55_contract.py
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m5.4.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m5.4.yaml --output openapi/pawday-m5.4.redocly.bundle.json
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m5.3.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m5.3.yaml --output openapi/pawday-m5.3.redocly.bundle.json
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m5.2.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m5.2.yaml --output openapi/pawday-m5.2.redocly.bundle.json
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m5.1.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m5.1.yaml --output openapi/pawday-m5.1.redocly.bundle.json
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m4.6.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m4.6.yaml --output openapi/pawday-m4.6.redocly.bundle.json
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m4.5.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m4.5.yaml --output openapi/pawday-m4.5.redocly.bundle.json
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m4.4.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m4.4.yaml --output openapi/pawday-m4.4.redocly.bundle.json
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m4.3.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m4.3.yaml --output openapi/pawday-m4.3.redocly.bundle.json
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m4.2.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m4.2.yaml --output openapi/pawday-m4.2.redocly.bundle.json
          npx --yes @redocly/cli@2.57.0 lint --extends=minimal openapi/pawday-m4.1.yaml
          npx --yes @redocly/cli@2.57.0 bundle openapi/pawday-m4.1.yaml --output openapi/pawday-m4.1.redocly.bundle.json

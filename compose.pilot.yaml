services:
  postgres:
    image: pawday-postgres:17.11-security20261013
    build:
      context: .
      dockerfile: deployment/images/alpine-runtime.Dockerfile
      args:
        BASE_IMAGE: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${PILOT_DB_NAME:?}
      POSTGRES_USER: pawday_pilot
      POSTGRES_PASSWORD: ${PILOT_DB_PASSWORD:?}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5546:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U pawday_pilot -d ${PILOT_DB_NAME:?}
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: pawday-redis:8.2.10-security20261013
    build:
      context: .
      dockerfile: deployment/images/alpine-runtime.Dockerfile
      args:
        BASE_IMAGE: redis:8.2.10-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    volumes:
    - redis-data:/data
    ports:
    - 127.0.0.1:6386:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    hostname: ${PILOT_MQ_HOSTNAME:-pawday-pilot-rabbitmq}
    image: pawday-rabbitmq:4.3.6-security20261013
    build:
      context: .
      dockerfile: deployment/images/alpine-runtime.Dockerfile
      args:
        BASE_IMAGE: rabbitmq:4.3.6-management-alpine@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95
    environment:
      RABBITMQ_DEFAULT_USER: pawday_pilot
      RABBITMQ_DEFAULT_PASS: ${PILOT_MQ_PASSWORD:?}
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    ports:
    - 127.0.0.1:5676:5672
    - 127.0.0.1:15676:15672
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - check_running
      interval: 5s
      timeout: 5s
      retries: 30
  opensearch:
    image: pawday-opensearch:3.9.0-security20261013
    build:
      context: .
      dockerfile: deployment/images/opensearch.Dockerfile
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      network.host: 0.0.0.0
      cluster.name: pawday-pilot
    volumes:
    - opensearch-data:/usr/share/opensearch/data
    ports:
    - 127.0.0.1:9206:9200
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s'
        >/dev/null
      interval: 5s
      timeout: 5s
      retries: 60
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  opensearch-data:

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: pawday
      POSTGRES_USER: pawday
      POSTGRES_PASSWORD: pawday_dev_only
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - pawday_pg:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U pawday -d pawday
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8.2.10-alpine
    ports:
    - 127.0.0.1:6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: pawday
      RABBITMQ_DEFAULT_PASS: pawday_dev_only
    ports:
    - 127.0.0.1:5672:5672
    - 127.0.0.1:15672:15672
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - check_running
      interval: 5s
      timeout: 5s
      retries: 30
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      network.host: 0.0.0.0
    ports:
    - 127.0.0.1:9200:9200
    - 127.0.0.1:9600:9600
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s'
        >/dev/null
      interval: 5s
      timeout: 5s
      retries: 60
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
    - pawday_search:/usr/share/opensearch/data
volumes:
  pawday_pg: null
  pawday_search: null
